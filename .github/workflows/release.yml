name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - CHANGELOG.md

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Read version and matching changelog section
        id: release_metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "VERSION must contain a simple SemVer value; found '$version'."
          }

          $lines = @(Get-Content -LiteralPath CHANGELOG.md)
          $headerPattern = '^## \[' + [regex]::Escape($version) + '\](?:\s|$)'
          $start = -1
          for ($index = 0; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match $headerPattern) {
              $start = $index
              break
            }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md does not contain a section for version $version."
          }

          $end = $lines.Count
          for ($index = $start + 1; $index -lt $lines.Count; $index++) {
            if ($lines[$index] -match '^## ') {
              $end = $index
              break
            }
          }

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $lines[$start..($end - 1)] | Set-Content -LiteralPath $notesPath -Encoding utf8
          $installerPath = Join-Path artifacts "AqTracker-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Installer build did not produce $installerPath."
          }

          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "tag=v$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "notes_path=$notesPath" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "installer_path=$((Resolve-Path -LiteralPath $installerPath).Path)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: AqTracker-Setup-${{ steps.release_metadata.outputs.version }}
          path: ${{ steps.release_metadata.outputs.installer_path }}
          if-no-files-found: error

      - name: Publish GitHub release and remove older releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.release_metadata.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.release_metadata.outputs.tag }}'
          $installer = '${{ steps.release_metadata.outputs.installer_path }}'
          $notes = '${{ steps.release_metadata.outputs.notes_path }}'
          $title = 'Agent Quota Tracker ${{ steps.release_metadata.outputs.version }}'

          function Get-GhHttpStatus([string] $output) {
            $match = [regex]::Match($output, '(?im)\b(?:HTTP\s+|status\s+code:\s*)(\d{3})\b')
            if ($match.Success) { return [int]$match.Groups[1].Value }
            return $null
          }

          function Test-GhKnownNotFound([Nullable[int]] $status, [string] $output) {
            if ($status -eq 404) { return $true }

            # gh release view can emit this exact message without an HTTP status.
            return $null -eq $status -and $output -match '(?im)^\s*release not found\s*$'
          }

          function Test-GhTransientFailure([Nullable[int]] $status, [string] $output) {
            if ($status -eq 408 -or $status -eq 429 -or ($status -ge 500 -and $status -le 599)) {
              return $true
            }

            return $output -match '(?im)(connection.*(reset|refused|timed out)|timeout|temporarily unavailable|TLS handshake|network is unreachable)'
          }

          function Invoke-GhWithRetry {
            param(
              [Parameter(Mandatory = $true)][string] $Action,
              [Parameter(Mandatory = $true)][scriptblock] $Command,
              [switch] $AllowNotFound,
              [switch] $ReturnTransientFailure,
              [scriptblock] $ConfirmSucceededAfterTransientFailure
            )

            $maxAttempts = 4
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              $output = (& $Command 2>&1 | Out-String).Trim()
              $exitCode = $LASTEXITCODE
              if ($exitCode -eq 0) {
                return [pscustomobject]@{ Succeeded = $true; NotFound = $false; Output = $output }
              }

              $status = Get-GhHttpStatus $output
              if ($AllowNotFound -and (Test-GhKnownNotFound $status $output)) {
                Write-Host "$Action was already absent."
                return [pscustomobject]@{ Succeeded = $true; NotFound = $true; Output = $output }
              }

              $isTransient = Test-GhTransientFailure $status $output
              if ($isTransient -and $null -ne $ConfirmSucceededAfterTransientFailure -and (& $ConfirmSucceededAfterTransientFailure)) {
                Write-Host "$Action was confirmed successful after a transient failure."
                return [pscustomobject]@{ Succeeded = $true; NotFound = $false; Output = $output }
              }

              if ($isTransient -and $attempt -lt $maxAttempts) {
                $delaySeconds = [int][Math]::Pow(2, $attempt - 1)
                Write-Warning "$Action failed transiently (attempt $attempt/$maxAttempts, HTTP $status). Retrying in $delaySeconds second(s)."
                Start-Sleep -Seconds $delaySeconds
                continue
              }

              if ($isTransient -and $ReturnTransientFailure) {
                return [pscustomobject]@{ Succeeded = $false; NotFound = $false; Output = $output }
              }

              $statusDescription = if ($null -eq $status) { 'without an HTTP status' } else { "with HTTP $status" }
              $exception = [System.InvalidOperationException]::new("$Action failed $statusDescription after $attempt attempt(s): $output")
              $exception.Data['IsTransient'] = $isTransient
              throw $exception
            }
          }

          function Get-Release([string] $releaseTag) {
            return Invoke-GhWithRetry -Action "View release $releaseTag" -AllowNotFound -Command {
              gh release view $releaseTag --json id
            }
          }

          function Confirm-ReleaseExistsAfterTransientFailure([string] $releaseTag) {
            try {
              return -not (Get-Release $releaseTag).NotFound
            }
            catch {
              if ($_.Exception.Data['IsTransient'] -eq $true) {
                Write-Warning "Could not confirm whether release $releaseTag was created because GitHub remained temporarily unavailable. Continuing the create retry."
                return $false
              }

              throw
            }
          }

          function Remove-OlderReleaseAndTag($release) {
            $releaseDeletion = Invoke-GhWithRetry -Action "Delete old release $($release.tag_name)" -AllowNotFound -ReturnTransientFailure -Command {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)"
            }

            # Try the tag even when the release deletion timed out: the server may have
            # applied the deletion before returning its transient failure response.
            $tagDeletion = Invoke-GhWithRetry -Action "Delete old tag $($release.tag_name)" -AllowNotFound -ReturnTransientFailure -Command {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$($release.tag_name)"
            }

            if (-not $releaseDeletion.Succeeded -or -not $tagDeletion.Succeeded) {
              Write-Warning "The current release was published, but cleanup of old release/tag $($release.tag_name) could not complete because GitHub remained temporarily unavailable. Cleanup will be retried by the next release workflow run."
            }
          }

          $release = Get-Release $tag
          if ($release.NotFound) {
            $created = Invoke-GhWithRetry -Action "Create release $tag" `
              -Command { gh release create $tag --title $title --notes-file $notes } `
              -ConfirmSucceededAfterTransientFailure { Confirm-ReleaseExistsAfterTransientFailure $tag }
            if (-not $created.Succeeded) { throw "Failed to create release $tag." }
          }

          $edited = Invoke-GhWithRetry -Action "Update release $tag" -Command {
            gh release edit $tag --title $title --notes-file $notes
          }
          if (-not $edited.Succeeded) { throw "Failed to update release $tag." }

          # Installs from before the Agent Quota Tracker rename (<= 0.22.x) only recognize the
          # CodexTracker-Setup-<version>.exe asset name, so the same setup is also published under it.
          $legacyInstaller = Join-Path (Split-Path -Parent $installer) ("CodexTracker-Setup-" + $tag.TrimStart('v') + ".exe")
          Copy-Item -LiteralPath $installer -Destination $legacyInstaller -Force

          $uploaded = Invoke-GhWithRetry -Action "Upload setup assets for $tag" -Command {
            gh release upload $tag $installer $legacyInstaller --clobber
          }
          if (-not $uploaded.Succeeded) { throw "Failed to upload the setup assets for $tag." }

          $endpoint = "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          $releaseList = Invoke-GhWithRetry -Action 'List releases for cleanup' -ReturnTransientFailure -Command {
            gh api --paginate --slurp $endpoint
          }
          if (-not $releaseList.Succeeded) {
            Write-Warning 'The current release was published, but cleanup of older releases could not complete because GitHub remained temporarily unavailable. Cleanup will be retried by the next release workflow run.'
            return
          }

          $releasePages = $releaseList.Output | ConvertFrom-Json
          $releases = @($releasePages | ForEach-Object { $_ })
          $olderReleases = @($releases | Where-Object { $_.tag_name -ne $env:CURRENT_TAG })

          foreach ($release in $olderReleases) {
            Remove-OlderReleaseAndTag $release
          }
